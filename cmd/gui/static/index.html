<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RECON</title>
<style>
  :root {
    --bg:        #16181c;
    --bg2:       #191c22;
    --bg3:       #23272f;
    --border:    #2a2e36;
    --border2:   #353a44;
    --text:      #ddd;
    --muted:     #9aa0a8;
    --dim:       #6c727b;
    --blue:      #2d6cdf;
    --blue-h:    #3578ea;
    --green:     #4ec766;
    --yellow:    #e6c63a;
    --orange:    #e6873a;
    --red:       #ff7676;
    --teal:      #7dd3c0;
    --gold:      #ffd479;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ── Header ── */
  header { padding: 10px 16px; background: #1f2228; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 1px; color: var(--text); }
  header h1 span { color: var(--blue); }
  .file-btn { padding: 5px 12px; background: var(--blue); border-radius: 4px; cursor: pointer; font-size: 12px; border: none; color: #fff; font-weight: 500; }
  .file-btn:hover { background: var(--blue-h); }
  header input[type=file] { display: none; }
  #status { color: var(--muted); font-size: 12px; }

  /* ── Summary bar ── */
  #summary { padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); display: none; gap: 12px; }
  #summary.show { display: flex; align-items: flex-start; }
  #summary .text { flex: 1; min-width: 0; }
  #summary .map { font-size: 12px; color: var(--muted); word-break: break-word; }
  #map-preview { display: none; flex-shrink: 0; }
  #map-preview img { width: 140px; height: 140px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); image-rendering: pixelated; background: #0d0f12; }
  #players { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .player-chip { padding: 4px 10px; border-radius: 4px; font-size: 12px; background: var(--bg3); border-left: 4px solid #555; cursor: pointer; transition: background 0.15s; }
  .player-chip:hover { background: #2a2e38; }
  .player-chip .chip-name { font-weight: 600; }
  .player-chip .chip-tactic { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .chip-badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 4px; vertical-align: middle; }
  .chip-badge.detected  { background: #1a3a22; color: var(--green); }
  .chip-badge.possible  { background: #3a3010; color: var(--yellow); }
  .chip-badge.ambiguous { background: #3a2a10; color: var(--orange); }
  .chip-badge.unknown   { background: #2a2a2a; color: var(--dim); }

  /* ── Tabs ── */
  #tabs { display: none; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--border); gap: 2px; }
  #tabs.show { display: flex; }
  .tab-btn { padding: 8px 14px; font-size: 12px; font-weight: 600; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--blue); }

  /* ── Filters ── */
  #filters { padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--border); display: none; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; }
  #filters.show { display: flex; }
  #filters input[type=search], #filters select { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); padding: 4px 8px; border-radius: 3px; font-size: 12px; }
  #filters input[type=search] { width: 200px; }
  #count { color: var(--muted); margin-left: auto; }

  /* ── Events table ── */
  #events { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { position: sticky; top: 0; background: var(--bg3); z-index: 1; }
  th { text-align: left; padding: 6px 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 4px 12px; border-bottom: 1px solid #1c1f25; vertical-align: top; }
  tr:hover td { background: #1c1f25; }
  .time   { color: var(--muted); font-family: ui-monospace,Consolas,monospace; font-variant-numeric: tabular-nums; width: 70px; }
  .player { width: 180px; }
  .order  { width: 200px; color: var(--teal); }
  .detail { width: 220px; color: var(--gold); font-family: ui-monospace,Consolas,monospace; }
  .detail .cost { color: var(--muted); }
  .args   { color: #b9beca; font-family: ui-monospace,Consolas,monospace; font-size: 11px; word-break: break-word; }
  .empty, .loading { padding: 40px; text-align: center; color: var(--dim); }
  .err { color: var(--red); }

  /* ── Tactics panel ── */
  #tactics-panel { flex: 1; overflow: auto; padding: 16px; display: none; }
  #tactics-panel.show { display: block; }
  .tactic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

  .tactic-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tactic-card-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; background: var(--bg3); border-bottom: 1px solid var(--border); }
  .tactic-card-header .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tactic-card-header .pname { font-weight: 700; font-size: 13px; flex: 1; }
  .tactic-card-header .pside { font-size: 11px; color: var(--muted); }
  .win-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; background: #1a3a22; color: var(--green); }

  .tactic-body { padding: 12px 14px; }

  .tactic-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .status-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; flex-shrink: 0; }
  .status-badge.detected  { background: #1a3a22; color: var(--green); }
  .status-badge.possible  { background: #3a3010; color: var(--yellow); }
  .status-badge.ambiguous { background: #3a2a10; color: var(--orange); }
  .status-badge.unknown   { background: #252525; color: var(--dim); }

  .conf-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .conf-bar  { flex: 1; height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
  .conf-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .conf-fill.detected  { background: var(--green); }
  .conf-fill.possible  { background: var(--yellow); }
  .conf-fill.ambiguous { background: var(--orange); }
  .conf-fill.unknown   { background: var(--dim); }
  .conf-pct  { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; width: 36px; text-align: right; color: var(--text); }

  .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--dim); margin: 10px 0 4px; }

  .evidence-list { list-style: none; margin: 0; padding: 0; }
  .evidence-list li { font-size: 11px; color: var(--muted); padding: 2px 0; display: flex; gap: 6px; }
  .evidence-list li::before { content: "·"; color: var(--blue); flex-shrink: 0; }
  .evidence-list li.penalty { color: #cc6666; }
  .evidence-list li.penalty::before { content: "·"; color: var(--red); }

  .candidates-list { display: flex; flex-direction: column; gap: 3px; }
  .cand-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .cand-name { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand-bar  { width: 60px; height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .cand-fill { height: 100%; background: var(--blue); border-radius: 2px; }
  .cand-score { width: 28px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .cand-row.top .cand-name { color: var(--text); font-weight: 600; }
  .cand-row.top .cand-fill { background: var(--green); }

  .unknown-tactic { color: var(--dim); font-size: 13px; font-style: italic; }
  .tactic-description { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 8px 0 4px; padding: 8px 10px; background: var(--bg3); border-radius: 4px; border-left: 2px solid var(--blue); }
  .tactic-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .tactic-meta-chip { font-size: 10px; padding: 2px 7px; border-radius: 3px; background: var(--bg3); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span>RE</span>CON</h1>
  <label class="file-btn">Open .rep<input type="file" id="file" accept=".rep"></label>
  <span id="status"></span>
</header>

<div id="summary">
  <div class="text">
    <div class="map" id="map-info"></div>
    <div id="players"></div>
  </div>
  <div id="map-preview" title="Loaded from your local Documents\Command and Conquer Generals Zero Hour Data\Maps folder">
    <img id="map-preview-img" alt="map preview">
  </div>
</div>

<div id="tabs">
  <button class="tab-btn active" id="tab-events" onclick="switchTab('events')">Events</button>
  <button class="tab-btn" id="tab-tactics" onclick="switchTab('tactics')">Tactics</button>
</div>

<div id="filters">
  <label><input type="checkbox" id="hide-noise" checked> Hide noise</label>
  <label><input type="checkbox" id="use-display-name" checked> Display name</label>
  <label>Mode:
    <select id="fps-mode">
      <option value="30">Original ZH (30 fps)</option>
      <option value="60">Generals Online (60 fps)</option>
    </select>
  </label>
  <select id="player-filter"><option value="">All players</option></select>
  <input type="search" id="search" placeholder="Search order name…">
  <span id="count"></span>
</div>

<div id="events"><div class="empty">Open a .rep file to begin.</div></div>
<div id="tactics-panel"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────

const NOISE_ORDERS = new Set([
  27, 1001, 1002, 1003,
  1016,1017,1018,1019,1020,1021,1022,1023,1024,1025,1026,1027,
  1058, 1068, 1092, 1095, 2000
]);

const COLOR_MAP = {
  Red:'#e3534b', Blue:'#3a8fe6', Green:'#4ec766', Yellow:'#e6c63a',
  Orange:'#e6873a', Purple:'#a466e6', Cyan:'#3acaca', Pink:'#e68fb9',
  Brown:'#9a6a3a', 'Metallic Grey':'#999', Silver:'#bbb', White:'#eee'
};

const STATUS_LABEL = { detected:'detected', possible:'possible', ambiguous:'ambiguous', unknown:'unknown' };

// ── State ─────────────────────────────────────────────────────────────────────

let replay  = null;
let activeTab = 'events';

const $ = (id) => document.getElementById(id);

// ── File input ────────────────────────────────────────────────────────────────

$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) parseFile(f);
});

async function parseFile(f) {
  $('status').innerHTML = `parsing <em>${escapeHtml(f.name)}</em>…`;
  $('events').innerHTML = '<div class="loading">Parsing replay…</div>';
  $('tactics-panel').innerHTML = '<div class="loading">Running tactic detection…</div>';
  const fd = new FormData();
  fd.append('file', f);
  try {
    const r = await fetch('/parse', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.text()) || `HTTP ${r.status}`);
    replay = await r.json();
    $('status').innerHTML = `<em>${escapeHtml(f.name)}</em>`;
    renderSummary();
    $('filters').classList.add('show');
    $('tabs').classList.add('show');
    render();
    renderTactics();
  } catch (err) {
    $('status').innerHTML = `<span class="err">error: ${escapeHtml(err.message)}</span>`;
    $('events').innerHTML = '<div class="empty">Failed to parse.</div>';
  }
}

// ── Tab switching ─────────────────────────────────────────────────────────────

function switchTab(tab) {
  activeTab = tab;
  $('tab-events').classList.toggle('active', tab === 'events');
  $('tab-tactics').classList.toggle('active', tab === 'tactics');
  $('filters').style.display     = tab === 'events'  ? '' : 'none';
  $('events').style.display      = tab === 'events'  ? '' : 'none';
  $('tactics-panel').classList.toggle('show', tab === 'tactics');
}

// ── Summary ───────────────────────────────────────────────────────────────────

function renderSummary() {
  if (!replay) return;
  const h  = replay.header || {};
  const md = h.metadata || {};
  const frames = h.frameCount || 0;
  const dur = frames ? ` · ${fmtTime(frames)}` : '';
  $('map-info').textContent = `${md.mapPath || '?'}${dur}`;
  loadMapPreview(md.mapPath || '');

  const players = (replay.summary || []).filter(p => p && p.name);
  const pf = $('player-filter');
  pf.innerHTML = '<option value="">All players</option>';

  const chips = $('players');
  chips.innerHTML = '';

  for (const p of players) {
    const td = p.tacticDetection;
    const status = td ? (td.status || 'unknown') : null;
    const chip = document.createElement('div');
    chip.className = 'player-chip';
    chip.style.borderLeftColor = COLOR_MAP[p.color] || '#555';
    chip.onclick = () => {
      switchTab('tactics');
      // scroll to that player's card
      const card = document.getElementById('tcard-' + p.name.replace(/[^a-zA-Z0-9]/g,'_'));
      if (card) card.scrollIntoView({ behavior:'smooth', block:'nearest' });
    };

    let tacticHtml = '';
    if (td && status && status !== 'unknown') {
      const name = td.detected_tactic ? formatTacticId(td.detected_tactic) : '?';
      tacticHtml = `<div class="chip-tactic">${escapeHtml(name)} <span class="chip-badge ${status}">${Math.round(td.confidence)}%</span></div>`;
    } else if (td) {
      tacticHtml = `<div class="chip-tactic"><span class="chip-badge unknown">unknown</span></div>`;
    }

    const winMark = p.win ? ' <span style="color:var(--green);font-size:10px">▲ WIN</span>' : '';
    chip.innerHTML = `<div class="chip-name">${escapeHtml(p.name)}${winMark} <span style="color:var(--muted);font-weight:400;font-size:11px">${escapeHtml(p.side||'')}</span></div>${tacticHtml}`;
    chips.appendChild(chip);

    const opt = document.createElement('option');
    opt.value = p.name;
    opt.textContent = p.name;
    pf.appendChild(opt);
  }
  $('summary').classList.add('show');
}

// ── Tactics panel ─────────────────────────────────────────────────────────────

function formatTacticId(id) {
  if (!id) return 'Unknown';
  const abbrevs = { wf:'WF', af:'AF', md:'MD', cc:'CC', th:'TH', bo:'BO', gla:'GLA', usa:'USA', ccg:'CCG', vee:'Vee', gatt:'Gatt' };
  let s = id
    .replace(/^(china|usa|gla)_/, '')
    .replace(/^\d+v\d+_/, '')
    .replace(/^\d+_/, '');
  return s.split('_').map(w => abbrevs[w.toLowerCase()] || (w.charAt(0).toUpperCase() + w.slice(1))).join(' ');
}

function renderTactics() {
  if (!replay) return;
  const players = (replay.summary || []).filter(p => p && p.name && p.side !== 'Observer');
  if (!players.length) {
    $('tactics-panel').innerHTML = '<div class="empty">No player data.</div>';
    return;
  }

  const parts = ['<div class="tactic-grid">'];

  for (const p of players) {
    const td   = p.tacticDetection;
    const color = COLOR_MAP[p.color] || '#555';
    const cardId = 'tcard-' + p.name.replace(/[^a-zA-Z0-9]/g,'_');
    const status = td ? (td.status || 'unknown') : 'unknown';
    const conf   = td ? Math.round(td.confidence || 0) : 0;
    const detected = td && td.detected_tactic;
    const winBadge = p.win ? '<span class="win-badge">WIN</span>' : '';

    parts.push(`<div class="tactic-card" id="${escapeHtml(cardId)}">`);

    // Card header
    parts.push(`
      <div class="tactic-card-header">
        <div class="dot" style="background:${color}"></div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pside">${escapeHtml(p.side||'')}</div>
        ${winBadge}
      </div>`);

    parts.push('<div class="tactic-body">');

    // Tactic name + status badge
    // Prefer the server-resolved tactic_name (from raw JSON); fall back to formatted ID
    const tacticDisplayName = (td && td.tactic_name) ||
      (detected ? formatTacticId(td.detected_tactic) :
       (status === 'ambiguous' && td && td.candidates && td.candidates.length) ? formatTacticId(td.candidates[0].id) : null);

    if (tacticDisplayName) {
      parts.push(`
        <div class="tactic-name">
          ${escapeHtml(tacticDisplayName)}
          <span class="status-badge ${status}">${STATUS_LABEL[status]||status}</span>
        </div>`);
    } else {
      parts.push(`<div class="tactic-name"><span class="unknown-tactic">Opening not detected</span></div>`);
    }

    // Confidence bar
    parts.push(`
      <div class="conf-row">
        <div class="conf-bar"><div class="conf-fill ${status}" style="width:${conf}%"></div></div>
        <div class="conf-pct">${conf}%</div>
      </div>`);

    // Strategy description (from raw build-order guide text)
    const desc = td && td.tactic_description;
    if (desc) {
      parts.push(`<div class="tactic-description">${escapeHtml(desc)}</div>`);
    }
    // Category / matchup chips
    const chips = [];
    if (td && td.tactic_category) chips.push(td.tactic_category);
    if (td && td.tactic_matchups)  chips.push(td.tactic_matchups);
    if (chips.length) {
      parts.push('<div class="tactic-meta">');
      for (const chip of chips) parts.push(`<span class="tactic-meta-chip">${escapeHtml(chip)}</span>`);
      parts.push('</div>');
    }

    // Evidence
    const evidence = (td && td.evidence) ? td.evidence.filter(Boolean) : [];
    if (evidence.length) {
      parts.push('<div class="section-label">Evidence</div><ul class="evidence-list">');
      for (const ev of evidence) {
        const isPenalty = ev.startsWith('[-');
        parts.push(`<li class="${isPenalty ? 'penalty' : ''}">${escapeHtml(ev)}</li>`);
      }
      parts.push('</ul>');
    }

    // Candidates ranking
    const cands = (td && td.candidates) ? td.candidates.filter(Boolean) : [];
    if (cands.length) {
      const visible = cands.slice(0, 5);
      parts.push('<div class="section-label">Candidates</div><div class="candidates-list">');
      for (let i = 0; i < visible.length; i++) {
        const c = visible[i];
        const pct = Math.min(100, Math.round(c.score || 0));
        parts.push(`
          <div class="cand-row ${i === 0 ? 'top' : ''}">
            <div class="cand-name" title="${escapeHtml(c.id)}">${escapeHtml(formatTacticId(c.id))}</div>
            <div class="cand-bar"><div class="cand-fill" style="width:${pct}%"></div></div>
            <div class="cand-score">${pct}</div>
          </div>`);
      }
      parts.push('</div>');
    }

    parts.push('</div></div>'); // tactic-body, tactic-card
  }

  parts.push('</div>'); // tactic-grid
  $('tactics-panel').innerHTML = parts.join('');
}

// ── Events table ──────────────────────────────────────────────────────────────

$('hide-noise').addEventListener('change', render);
$('use-display-name').addEventListener('change', render);
$('player-filter').addEventListener('change', render);
$('search').addEventListener('input', debounce(render, 150));
$('fps-mode').addEventListener('change', () => { renderSummary(); render(); });

function fmtTime(tc) {
  const fps = parseInt($('fps-mode').value, 10) || 30;
  const totalSec = Math.round(tc / fps);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function fmtDetail(chunk) {
  const d = chunk.details;
  if (!d || typeof d !== 'object') return '';
  const varName = d.Name || d.name;
  const displayName = d.DisplayName || d.displayName;
  if (!varName && !displayName) return '';
  const useDisplay = $('use-display-name').checked;
  const name = useDisplay ? (displayName || varName) : (varName || displayName);
  const cost = d.Cost || d.cost;
  let html = escapeHtml(name);
  if (cost && cost > 0) html += ` <span class="cost">$${cost}</span>`;
  return html;
}

function fmtArgs(chunk) {
  const arr = chunk.arguments;
  if (!arr || !arr.length) return '';
  try {
    const parts = [];
    for (const g of arr) {
      if (!g) continue;
      const inner = Array.isArray(g.args) ? g.args : (Array.isArray(g.Args) ? g.Args : null);
      if (!inner) { parts.push(JSON.stringify(g)); continue; }
      const flat = inner.map(v => {
        if (v && typeof v === 'object') {
          if ('X' in v && 'Y' in v) return `(${v.X},${v.Y}${'Z' in v ? ','+v.Z : ''})`;
          return JSON.stringify(v);
        }
        return String(v);
      }).join(', ');
      parts.push(flat);
    }
    const s = parts.join(' | ');
    return s.length > 240 ? s.slice(0,240) + '…' : s;
  } catch { return ''; }
}

function render() {
  if (!replay) return;
  const hideNoise    = $('hide-noise').checked;
  const playerFilter = $('player-filter').value;
  const search       = $('search').value.trim().toLowerCase();
  const body         = replay.body || [];
  const filtered     = [];
  for (const c of body) {
    if (hideNoise && NOISE_ORDERS.has(c.orderCode)) continue;
    if (playerFilter && c.playerName !== playerFilter) continue;
    if (search && !(c.orderName || '').toLowerCase().includes(search)) continue;
    filtered.push(c);
  }
  $('count').textContent = `${filtered.length.toLocaleString()} of ${body.length.toLocaleString()} events`;

  const CAP  = 10000;
  const slice = filtered.length > CAP ? filtered.slice(0, CAP) : filtered;
  const out  = ['<table><thead><tr><th>Time</th><th>Player</th><th>Order</th><th>Detail</th><th>Args</th></tr></thead><tbody>'];
  for (const c of slice) {
    out.push(
      '<tr><td class="time">',  fmtTime(c.timeCode),
      '</td><td class="player">', escapeHtml(c.playerName || ''),
      '</td><td class="order">',  escapeHtml(c.orderName || String(c.orderCode || '')),
      '</td><td class="detail">', fmtDetail(c),
      '</td><td class="args">',   escapeHtml(fmtArgs(c)),
      '</td></tr>'
    );
  }
  if (filtered.length > CAP) {
    out.push(`<tr><td colspan="5" class="empty">… ${(filtered.length-CAP).toLocaleString()} more events hidden. Narrow the filter.</td></tr>`);
  }
  out.push('</tbody></table>');
  $('events').innerHTML = out.join('');
}

// ── Map preview ───────────────────────────────────────────────────────────────

function mapNameFromPath(p) {
  if (!p) return '';
  let s = p.replace(/\\/g,'/').replace(/\.map$/i,'');
  const i = s.lastIndexOf('/');
  return i >= 0 ? s.slice(i+1) : s;
}

function loadMapPreview(mapPath) {
  const name = mapNameFromPath(mapPath);
  const slot = $('map-preview');
  const img  = $('map-preview-img');
  slot.style.display = 'none';
  img.removeAttribute('src');
  if (!name) return;
  img.onload  = () => { slot.style.display = 'block'; };
  img.onerror = () => { slot.style.display = 'none';  };
  img.src = '/map/preview?name=' + encodeURIComponent(name);
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
</script>
